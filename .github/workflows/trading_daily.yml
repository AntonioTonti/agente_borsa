name: Daily Trading Analysis

on:
  schedule:
    # ~12:00 Italia (CET = UTC+1, CEST = UTC+2)
    # Impostato alle 10:07 UTC per evitare i picchi del minuto :00
    - cron: '7 10 * * 1-5'
    # ~17:30 Italia
    # Impostato alle 15:37 UTC per evitare i picchi del minuto :30
    - cron: '37 15 * * 1-5'
  workflow_dispatch:

jobs:
  daily-analysis:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout codice
        uses: actions/checkout@v4
        
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Cache dipendenze
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-
            
      - name: Installa dipendenze
        run: |
          pip install yfinance ta numpy pandas requests
          
      - name: Esegui analisi giornaliera
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python agent_daily.py
