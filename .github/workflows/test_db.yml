name: Test db_manager

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test-db:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout codice
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Installa dipendenze
        run: |
          python -m pip install --upgrade pip

      - name: Test db_manager
        run: python db_manager.py

      - name: Mostra contenuto DB
        run: |
          echo "=== File DB ==="
          ls -la trading_history.db
          echo ""
          echo "=== Contenuto tabella previsioni ==="
          python -c "import sqlite3; c=sqlite3.connect('trading_history.db'); [print(r) for r in c.execute('SELECT * FROM previsioni')]"
          echo ""
          echo "=== Contenuto tabella pesi ==="
          python -c "import sqlite3; c=sqlite3.connect('trading_history.db'); [print(r) for r in c.execute('SELECT * FROM pesi')]"
