- name: Commit, Pull and Push Database & Reports
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # Aggiunge i report generati e il database SQLite
          git add trading_history.db docs/
          
          if ! git diff --staged --quiet; then
            git commit -m "auto: aggiornamento report flash e DB storico [skip ci]"
            git pull --rebase origin main
            git push origin main || (git pull --rebase origin main && git push origin main)
          else
            echo "Nessuna modifica da salvare."
          fi
