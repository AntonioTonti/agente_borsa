name: Forecast ETF Agent (Google TimesFM)

on:
  schedule:
    # Esecuzione dal lunedì al venerdì alle 08:30 e alle 17:30 UTC
    - cron: '30 8,17 * * 1-5'
  workflow_dispatch: # Permette l'avvio manuale dalla scheda Actions di GitHub

jobs:
  run-forecast-etf:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Cache HuggingFace Models
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: ${{ runner.os }}-hf-timesfm-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-hf-timesfm-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install timesfm yfinance pandas numpy ta requests

      - name: Run Forecast ETF Agent
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python forecast_etf.py

      - name: Commit and Push Updated Web Pages
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add docs/forecast_etf/*.html || true
          git commit -m "Auto-update Forecast ETF web pages [skip ci]" || exit 0
          git push
