name: Trading Flash (Orario)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-flash:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout codice
        uses: actions/checkout@v4

      - name: Configura Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Installa dipendenze
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install plotly yfinance pandas ta requests

      - name: Esegui Agente FLASH
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python agent_flash.py

      - name: Salva modifiche pagine web e stato
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          
          # Effettua il commit solo se ci sono modifiche
          if ! git diff --staged --quiet; then
            git commit -m "auto: aggiornamento report flash [skip ci]"
            
            # Sincronizza con il remoto prima del push
            git pull --rebase origin main
            
            # Tenta il push con fallback in caso di race condition
            git push origin main || (git pull --rebase origin main && git push origin main)
          else
            echo "Nessuna modifica da inviare."
          fi
