name: Agente Kenzo

on:
  workflow_dispatch:

concurrency:
  group: kenzo-agent
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run-kenzo:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout codice
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Installa dipendenze
        run: |
          python -m pip install --upgrade pip
          pip install yfinance pandas ta requests plotly

      - name: Esegui Agente KENZO
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python agent_kenzo.py

      - name: Commit e Push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          git add docs/ kenzo_history.db 2>/dev/null || true
          git add docs/ data_state/ 2>/dev/null || true
          
          if ! git diff --staged --quiet; then
            git commit -m "auto: aggiornamento Kenzo [skip ci]"
            git pull --rebase origin main || true
            git push origin main || (git pull --rebase origin main && git push origin main)
          else
            echo "Nessuna modifica da salvare."
          fi
