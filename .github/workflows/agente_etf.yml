name: Agente ETF Orario

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-etf-agent:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout codice
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install plotly yfinance pandas pandas-ta requests

      - name: Esegui Agente ETF
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python agente_etf.py

      - name: Salva modifiche pagine web e stato
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/ data_state/
          git diff --quiet && git diff --staged --quiet || (git commit -m "auto: aggiornamento report ETF [skip ci]" && git push)
